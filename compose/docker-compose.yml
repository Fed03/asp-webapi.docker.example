name: "compose-lab"

services:
  client-react-caddy:
    labels:
      shipyard.primary-route: true
      shipyard.route: "/"
    image: client-react-caddy
    build:
      context: ../client-react/
      dockerfile: ../client-react/Dockerfiles/Dockerfile.6
    environment:
      - NODE_SERVICE=http://api-node:3000
      - GO_SERVICE=http://api-golang:8080
    networks:
      - frontend
    ports:
      - 80:8080
    depends_on:
      - db
      - api-node
      - api-golang
    restart: unless-stopped
  api-node:
    labels:
      shipyard.route: "/api/node/"
      shipyard.route.rewrite: true
    image: api-node
    build:
      context: ../api-node/
      dockerfile: ../api-node/Dockerfiles/Dockerfile.7
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://postgres:foobarbaz@db:5432/postgres
    networks:
      - frontend
      - backend
    ports:
      - 3000:3000
    restart: unless-stopped
  api-golang:
    labels:
      shipyard.route: "/api/golang/"
      shipyard.route.rewrite: true
    image: api-golang
    build:
      context: ../api-golang/
      dockerfile: ../api-golang/Dockerfiles/Dockerfile.6
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://postgres:foobarbaz@db:5432/postgres
    networks:
      - frontend
      - backend
    ports:
      - 8080:8080
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=foobarbaz
    networks:
      - backend
    ports:
      - 5432:5432
volumes:
  pgdata:
networks:
  frontend:
  backend:
